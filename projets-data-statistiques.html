<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Portfolio — Data & statistiques | RAHAOUI ANALYTICS</title>

<style>

/* =========================
   VARIABLES
========================= */

:root{
--navy:#0b1d35;
--navy2:#14345a;
--navy3:#1d4773;
--gold:#d2ad55;
--gold2:#ead08a;
--ink:#172334;
--muted:#66758a;
--light:#f4f6f9;
--white:#ffffff;
--line:#e4e9ef;
--shadow:0 18px 45px rgba(11,29,53,.08);
--shadow-hover:0 24px 55px rgba(11,29,53,.14);
}


/* =========================
   RESET
========================= */

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html{
scroll-behavior:smooth;
}

body{
font-family:Arial,Helvetica,sans-serif;
background:var(--light);
color:var(--ink);
line-height:1.6;
}

a{
text-decoration:none;
color:inherit;
}


/* =========================
   CONTAINER
========================= */

.container{
width:min(1120px,92%);
margin:0 auto;
}


/* =========================
   HEADER
========================= */

header{
background:rgba(255,255,255,.97);
border-bottom:1px solid var(--line);
}

.nav{
min-height:78px;
display:flex;
align-items:center;
justify-content:space-between;
gap:25px;
}

.brand{
font-size:18px;
font-weight:800;
letter-spacing:1.4px;
color:var(--navy);
}

.brand span{
color:var(--gold);
}

.nav-back{
font-size:12px;
font-weight:700;
letter-spacing:.5px;
color:var(--muted);
transition:.25s ease;
}

.nav-back:hover{
color:var(--navy);
transform:translateX(-4px);
}


/* =========================
   HERO
========================= */

.hero{
position:relative;
overflow:hidden;
padding:88px 0 72px;
background:linear-gradient(135deg,var(--navy),var(--navy2));
color:var(--white);
}

.hero::before{
content:"";
position:absolute;
width:420px;
height:420px;
right:-180px;
top:-220px;
border:1px solid rgba(234,208,138,.20);
border-radius:50%;
}

.hero::after{
content:"";
position:absolute;
width:250px;
height:250px;
right:-80px;
bottom:-170px;
border:1px solid rgba(234,208,138,.12);
border-radius:50%;
}

.hero-inner{
position:relative;
z-index:2;
}

.eyebrow{
margin-bottom:16px;
font-size:11px;
font-weight:800;
letter-spacing:2px;
text-transform:uppercase;
color:var(--gold2);
}

.hero h1{
margin-bottom:20px;
font-size:clamp(42px,6vw,68px);
font-weight:800;
line-height:1;
letter-spacing:-2px;
}

.hero p{
max-width:690px;
font-size:16px;
line-height:1.8;
color:rgba(255,255,255,.76);
}


/* =========================
   PROJECT SECTION
========================= */

.projects{
padding:76px 0 105px;
}

.section-heading{
margin-bottom:36px;
}

.section-label{
margin-bottom:8px;
font-size:11px;
font-weight:800;
letter-spacing:1.8px;
text-transform:uppercase;
color:var(--gold);
}

.section-heading h2{
font-size:30px;
line-height:1.25;
color:var(--navy);
}


/* =========================
   PROJECT GRID
========================= */

.project-grid{
display:grid;
grid-template-columns:repeat(2,minmax(0,1fr));
gap:30px;
}


/* =========================
   PROJECT CARD
========================= */

.project-card{
overflow:hidden;
background:var(--white);
border:1px solid var(--line);
border-radius:15px;
box-shadow:var(--shadow);
transition:
transform .3s ease,
box-shadow .3s ease,
border-color .3s ease;
}

.project-card:hover{
transform:translateY(-7px);
box-shadow:var(--shadow-hover);
border-color:#d6dde6;
}


/* =========================
   PROJECT IMAGE
========================= */

.project-image{
position:relative;
height:285px;
overflow:hidden;
background:#dfe5ec;
}

.project-image img{
display:block;
width:100%;
height:100%;
object-fit:cover;
transition:transform .55s ease;
}

.project-card:hover .project-image img{
transform:scale(1.045);
}

.project-number{
position:absolute;
top:18px;
left:18px;
padding:7px 11px;
border-radius:5px;
background:rgba(11,29,53,.92);
color:var(--gold2);
font-size:10px;
font-weight:800;
letter-spacing:1.2px;
}


/* =========================
   PROJECT CONTENT
========================= */

.project-content{
padding:28px 28px 31px;
}

.project-category{
margin-bottom:9px;
font-size:10px;
font-weight:800;
letter-spacing:1.5px;
text-transform:uppercase;
color:var(--gold);
}

.project-content h3{
margin-bottom:13px;
font-size:23px;
line-height:1.3;
color:var(--navy);
}

.project-content p{
margin-bottom:23px;
font-size:14px;
line-height:1.75;
color:var(--muted);
}


/* =========================
   PROJECT LINK
========================= */

.project-link{
display:inline-flex;
align-items:center;
gap:8px;
padding-bottom:5px;
border-bottom:1px solid var(--gold);
font-size:11px;
font-weight:800;
letter-spacing:.9px;
text-transform:uppercase;
color:var(--navy);
transition:
color .25s ease,
gap .25s ease;
}

.project-link:hover{
gap:12px;
color:#9a792d;
}


/* =========================
   FUTURE PROJECT
========================= */

.project-card.future{
cursor:default;
}

.future .project-image{
display:flex;
align-items:center;
justify-content:center;
background:
linear-gradient(135deg,#edf1f5,#f7f8fa);
}

.future-placeholder{
text-align:center;
color:#9aa7b7;
}

.future-placeholder .plus{
display:block;
margin-bottom:8px;
font-size:35px;
font-weight:300;
color:#c0c9d3;
}

.future-placeholder span{
font-size:10px;
font-weight:800;
letter-spacing:1.5px;
text-transform:uppercase;
}


/* =========================
   FOOTER
========================= */

footer{
padding:29px 0;
background:var(--navy);
color:rgba(255,255,255,.62);
font-size:12px;
}

.footer-inner{
display:flex;
align-items:center;
justify-content:space-between;
gap:20px;
}

.footer-brand{
font-weight:800;
letter-spacing:1.2px;
color:var(--white);
}


/* =========================
   RESPONSIVE
========================= */

@media(max-width:800px){

.project-grid{
grid-template-columns:1fr;
}

}

@media(max-width:650px){

.nav{
min-height:70px;
}

.brand{
font-size:16px;
}

.nav-back{
font-size:11px;
}

.hero{
padding:67px 0 58px;
}

.hero h1{
font-size:45px;
letter-spacing:-1.4px;
}

.hero p{
font-size:14px;
}

.projects{
padding:60px 0 80px;
}

.section-heading h2{
font-size:27px;
}

.project-image{
height:235px;
}

.project-content{
padding:24px 22px 27px;
}

.project-content h3{
font-size:21px;
}

.footer-inner{
display:block;
}

.footer-inner p{
margin-top:7px;
}

}

@media(max-width:430px){

.nav{
flex-direction:column;
justify-content:center;
gap:5px;
padding:13px 0;
}

.hero h1{
font-size:39px;
}

.project-image{
height:215px;
}

}

</style>
</head>
